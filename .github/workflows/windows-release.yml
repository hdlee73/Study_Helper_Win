name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
      - name: Read version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-rc\.\d+)?$') { throw 'Invalid VERSION' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install --only-binary=:all: -r requirements-build.txt -c constraints-resolved.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
      - name: Offline tests and source smoke test
        run: |
          python test_core.py
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          python study_helper.py --self-test source-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Source smoke test failed' }
      - name: Collect notices and build executable
        env:
          STUDY_EXTERNAL_FFMPEG: '1'
        run: |
          python scripts/collect_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Notice collection failed' }
          python -m PyInstaller --noconfirm --clean StudyHelper.spec
          if ($LASTEXITCODE -ne 0) { throw 'Executable build failed' }
      - name: Frozen executable smoke test
        run: |
          $report = Join-Path $PWD 'build-validation.json'
          $process = Start-Process -FilePath '.\dist\StudyHelper\StudyHelper.exe' -ArgumentList @('--self-test', "`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Frozen smoke test timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw 'Frozen smoke test failed'
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Missing successful smoke test result' }
      - name: Build installer and portable ZIP
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item README.md, RELEASE_NOTES.md -Destination dist/StudyHelper
          Compress-Archive -Path dist/StudyHelper -DestinationPath "release-assets/StudyHelper-Windows-x64-$env:APP_VERSION.zip"
          Copy-Item "installer_output/StudyHelper-Setup-$env:APP_VERSION.exe" release-assets
          Copy-Item build-validation.json, source-validation.json release-assets
          python -m pip freeze | Set-Content -Encoding utf8 release-assets/requirements-lock.txt
          $lines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 release-assets/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; assets were not replaced."
            exit 0
          }
          $arguments = @('release','create',$tag,'--target',$env:GITHUB_SHA,'--title',"Study Helper $env:APP_VERSION",'--notes-file','RELEASE_NOTES.md','--draft')
          if ($env:APP_VERSION -match '-rc\.') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence
          path: |
            *validation.json
            build/StudyHelper/warn-StudyHelper.txt
            release-assets/SHA256SUMS.txt
          if-no-files-found: ignore

